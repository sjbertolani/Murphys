[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "murphy"
version = "0.1.0"
description = "BLF-inspired binary forecasting for near-the-money call options."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=15.0",
  "pydantic>=2.7",
  "scikit-learn>=1.4",
  "scipy>=1.12",
]

[project.optional-dependencies]
agent = [
  "openai>=1.50",
  "litellm>=1.49",
]
training = [
  "scalarlm>=0.9940",
]
gcp = [
  "cloud-sql-python-connector[pg8000]>=1.11",
  "google-cloud-bigquery>=3.25",
  "google-cloud-storage>=2.18",
  "sqlalchemy>=2.0",
]
providers = [
  "yfinance>=0.2.50",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
murphy = "murphy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/murphy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
